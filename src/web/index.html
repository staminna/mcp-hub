    api.listContent(kind)
      .then(setEntries)
      .catch(err => { setEntries([]); toast.error(`Could not load ${kind}`, err.message); });
  }, [kind]);

  const open = async (entry) => {
    if (editing && draft !== doc?.content) {
      toast.error('Unsaved changes', 'Save or cancel your edit first');
      return;
    }
    setSelected(entry); setDoc(null); setEditing(false);
    try {
      setDoc(await api.readContent(kind, entry.path));
    } catch (err) {
      toast.error('Could not open file', err.message);
    }
  };

  const save = async () => {
    setSaving(true);
    try {
      await api.saveContent(kind, selected.path, draft);
      setDoc(await api.readContent(kind, selected.path));
      setEditing(false);
      toast.success('Saved', selected.path);
      api.listContent(kind).then(setEntries).catch(() => {});
    } catch (err) {
      toast.error('Save failed', err.message);
    } finally {
      setSaving(false);
    }
  };

  if (!entries) return <Loading message={`Loading ${kind}…`} />;

  const q = filter.toLowerCase();
  const visible = entries.filter(e =>
    !q || [cfg.label(e), e.name, e.description, cfg.group(e)].join(' ').toLowerCase().includes(q));
  const groups = [];
  for (const e of visible) {
    const g = cfg.group(e);
    if (!groups.length || groups[groups.length - 1].name !== g) groups.push({ name: g, items: [] });
    groups[groups.length - 1].items.push(e);
  }

  const html = doc && !editing ? renderMarkdown(doc.body) : null;
  const fm = doc && Object.keys(doc.frontmatter || {}).length
    ? Object.entries(doc.frontmatter).map(([k, v]) => `${k}: ${typeof v === 'string' ? v : JSON.stringify(v)}`).join('\n')
    : '';

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <div className="page-title">{cfg.title}</div>
          <div className="page-subtitle">{cfg.subtitle}</div>
        </div>
      </div>

      <div className="md-layout">
        <div className="card">
          <div style={{ padding: 10, borderBottom: '1px solid var(--border)' }}>
            <input className="field-input" placeholder={`Filter ${visible.length} of ${entries.length}…`}
                   value={filter} onChange={e => setFilter(e.target.value)} style={{ width: '100%' }} />
          </div>
          <div className="md-list">
            {groups.length === 0 && <div className="md-item-desc" style={{ padding: 12 }}>Nothing found.</div>}
            {groups.map(g => (
              <React.Fragment key={g.name}>
                <div className="md-group">{g.name}</div>
                {g.items.map(e => (
                  <button key={e.path} className={`md-item${selected?.path === e.path ? ' active' : ''}`} onClick={() => open(e)}>
                    <div className="md-item-name">
                      {cfg.label(e)}
                      {e.isIndex && <Tag label="index" />}
                      {e.type && <Tag label={e.type} />}
                    </div>
                    {e.description && <div className="md-item-desc">{e.description}</div>}
                  </button>
                ))}
              </React.Fragment>
            ))}
          </div>
        </div>

        <div className="card">
          {!selected ? (
            <EmptyState icon={kind === 'skills' ? '🧩' : '🧠'} title={`Select a ${kind === 'skills' ? 'skill' : 'memory'}`} desc="Pick a file on the left to read or edit it." />
          ) : (
            <>
              <div className="card-header">
                <div style={{ minWidth: 0 }}>
                  <div className="card-title">{selected.name}</div>
                  <div className="md-path">{selected.path}</div>
                </div>
                <div className="page-actions">
                  {editing ? (
                    <>
                      <button className="btn btn-ghost btn-sm" onClick={() => setEditing(false)} disabled={saving}>Cancel</button>
                      <button className="btn btn-primary btn-sm" onClick={save} disabled={saving || draft === doc.content}>
                        {saving ? <><Spinner /> Saving…</> : 'Save'}
                      </button>
                    </>
                  ) : (
                    <button className="btn btn-secondary btn-sm" disabled={!doc} onClick={() => { setDraft(doc.content); setEditing(true); }}>✎ Edit</button>
                  )}
                </div>
              </div>
              <div className="card-body">
                {!doc ? <Loading message="Opening…" /> : editing ? (
                  <textarea className="field-textarea md-editor" value={draft} onChange={e => setDraft(e.target.value)} spellCheck={false} />
                ) : (
                  <>
                    {fm && <div className="md-frontmatter">{fm}</div>}
                    {html != null
                      ? <div className="markdown" dangerouslySetInnerHTML={{ __html: html }} />
                      : <pre className="code-block" style={{ whiteSpace: 'pre-wrap' }}>{doc.body}</pre>}
                  </>
                )}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════════════════════════ */
const NAV = [
  { id: 'dashboard', label: 'Dashboard',   icon: '⊞', hash: '#/' },
  { id: 'targets',   label: 'Targets',     icon: '🎯', hash: '#/targets' },
  { id: 'diff',      label: 'Diff View',   icon: '⟺', hash: '#/diff' },
  null, // separator
  { id: 'skills',    label: 'Skills',      icon: '🧩', hash: '#/skills' },
  { id: 'memories',  label: 'Memories',    icon: '🧠', hash: '#/memories' },
  null, // separator
  { id: 'add',       label: 'Add Server',  icon: '+', hash: '#/add' },
  { id: 'import',    label: 'Import',      icon: '📥', hash: '#/import' },
  { id: 'discover',  label: 'Discovery',   icon: '🔍', hash: '#/discover' },
];

function Sidebar({ currentView }) {
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="brand-icon">⚡</div>
        <div>
          <div className="brand-name">MCP Hub</div>
          <div className="brand-version">v1.0</div>
        </div>
      </div>
      <nav className="sidebar-nav">
        <div className="nav-section-label">Navigation</div>
        {NAV.map((item, i) => {
          if (!item) return <div key={i} style={{ height: 1, background: 'var(--border)', margin: '6px 8px' }} />;
          return (
            <button
              key={item.id}
              className={`nav-item${currentView === item.id ? ' active' : ''}`}
              onClick={() => navigate(item.hash)}
            >
              <span className="nav-item-icon">{item.icon}</span>
              <span className="nav-item-label">{item.label}</span>
            </button>
          );
        })}
      </nav>
      <div className="sidebar-footer">
        <div className="sidebar-status">
          <div className="status-dot" />
          Hub running
        </div>
      </div>
    </aside>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════════════════ */
const BREADCRUMBS = {
  dashboard: [{ label: 'Dashboard' }],
  server:    [{ label: 'Dashboard', hash: '#/' }, { label: 'Server Detail' }],
  targets:   [{ label: 'Targets' }],
  add:       [{ label: 'Dashboard', hash: '#/' }, { label: 'Add Server' }],
  import:    [{ label: 'Dashboard', hash: '#/' }, { label: 'Import' }],
  discover:  [{ label: 'Discovery' }],
  diff:      [{ label: 'Diff View' }],
  skills:    [{ label: 'Skills' }],
  memories:  [{ label: 'Memories' }],
  '404':     [{ label: '404' }],
};

function Header({ view, params }) {
  const crumbs = BREADCRUMBS[view] || [{ label: view }];
  return (
    <header className="header">
      <div className="header-left">
        <div className="breadcrumb">
          {crumbs.map((c, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span className="breadcrumb-sep">/</span>}
              {c.hash
                ? <a href={c.hash} style={{ color: 'var(--text-secondary)' }}>{c.label}</a>
                : <span className={i === crumbs.length - 1 ? 'breadcrumb-current' : ''}>{c.label}</span>}
            </React.Fragment>
          ))}
          {view === 'server' && params.id && (
            <><span className="breadcrumb-sep">/</span><span className="breadcrumb-current">{params.id}</span></>
          )}
        </div>
      </div>
      <div className="header-actions">
        <button className="btn btn-ghost btn-sm" onClick={() => navigate('#/discover')} title="Discover servers">
          🔍
        </button>
        <button className="btn btn-secondary btn-sm" onClick={() => navigate('#/add')}>
          + Add Server
        </button>
      </div>
    </header>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════════════════════════ */
function App() {
  const hash = useRoute();
  const { view, params } = matchRoute(hash);

  const renderView = () => {
    switch (view) {
      case 'dashboard': return <DashboardView />;
      case 'server':    return <ServerDetailView id={params.id} />;
      case 'targets':   return <TargetsView />;
      case 'add':       return <AddServerView />;
      case 'import':    return <ImportView />;
      case 'discover':  return <DiscoverView />;
      case 'diff':      return <DiffView />;
      case 'skills':    return <MarkdownBrowserView key="skills" kind="skills" />;
      case 'memories':  return <MarkdownBrowserView key="memories" kind="memories" />;
      default:
        return (
          <div className="page">
            <EmptyState icon="🔭" title="Page not found" desc="The route you requested doesn't exist." action={<button className="btn btn-primary" onClick={() => navigate('#/')}>← Back to Dashboard</button>} />
          </div>
        );
    }
  };

  return (
    <ToastProvider>
      <div className="app-shell">
        <Sidebar currentView={view} />
        <Header view={view} params={params} />
        <main className="main">
          {renderView()}
        </main>
      </div>
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
